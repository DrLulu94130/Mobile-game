name: inkognito
description: "Inkognito — Create hide-and-seek challenges from your own photos by camouflaging original creatures called Inklings."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management & DI
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.7

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  firebase_storage: ^12.3.2
  cloud_functions: ^5.1.3
  firebase_crashlytics: ^4.1.3
  firebase_analytics: ^11.3.3

  # Monetization
  purchases_flutter: ^8.1.0
  google_mobile_ads: ^5.1.0

  # Deep links
  app_links: ^6.3.2

  # Media & drawing
  image_picker: ^1.1.2
  image: ^4.2.0
  path_provider: ^2.1.4
  share_plus: ^10.0.2

  # 3D mascot rendering & pose capture
  model_viewer_plus: ^1.9.0
  webview_flutter: ^4.10.0

  # Utils
  uuid: ^4.5.1
  intl: ^0.20.2
  collection: ^1.18.0
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.0
  vector_math: ^2.1.4
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/packs/
    - assets/models/
  fonts:
    - family: LuckiestGuy
      fonts:
        - asset: assets/fonts/LuckiestGuy-Regular.ttf
